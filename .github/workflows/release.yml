name: Release Deja

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_name:
        description: 'Release title'
        required: false
        default: 'Deja v1.0.0 — Official Windows Release'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Execute Deja test suite
        run: npm test

      - name: Build Windows Executables (NSIS & Portable)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Standard Release Asset Filenames
        shell: pwsh
        run: |
          Write-Host "Creating dot-formatted and hyphen-formatted asset aliases for release downloads & auto-updater..."
          Get-ChildItem dist -Filter "Deja Setup *.exe" | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
            Write-Host "Created installer aliases for $($_.Name): $dotted, $dashed"
          }
          Get-ChildItem dist -Filter "Deja Setup *.blockmap" | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
            Write-Host "Created blockmap aliases for $($_.Name): $dotted, $dashed"
          }
          Get-ChildItem dist -Filter "Deja *.exe" | Where-Object { $_.Name -notmatch "Setup" } | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
            Write-Host "Created portable aliases for $($_.Name): $dotted, $dashed"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: ${{ inputs.release_name || (github.ref_type == 'tag' && github.ref_name) || 'Deja v1.0.0 — Official Windows Release' }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
