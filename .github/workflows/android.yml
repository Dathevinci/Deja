name: Android CI & Release APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Keystore & local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > deja-release.jks
          echo "storeFile=deja-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        else
          keytool -genkeypair -v -keystore deja-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias deja -storepass dejapass123 -keypass dejapass123 -dname "CN=Deja, OU=Music, O=Deja, L=Global, S=Global, C=US"
          echo "storeFile=deja-release.jks" > keystore.properties
          echo "storePassword=dejapass123" >> keystore.properties
          echo "keyAlias=deja" >> keystore.properties
          echo "keyPassword=dejapass123" >> keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare Named Deja APKs
      run: |
        mkdir -p dist-apk
        UNIV=$(find app/build/outputs/apk/prod/release -name "*universal*.apk" | head -n 1)
        ARM64=$(find app/build/outputs/apk/prod/release -name "*arm64-v8a*.apk" | head -n 1)
        ANY_APK=$(find app/build/outputs/apk/prod/release -name "*.apk" | head -n 1)
        if [ -n "$UNIV" ]; then
          cp "$UNIV" dist-apk/Deja.apk
        elif [ -n "$ANY_APK" ]; then
          cp "$ANY_APK" dist-apk/Deja.apk
        fi
        if [ -n "$ARM64" ]; then
          cp "$ARM64" dist-apk/Deja-arm64-v8a.apk
        fi
        ls -lh dist-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: deja-android-release-apk
        path: dist-apk/*.apk

    - name: Attach APK to GitHub Release v1.2.1 (Latest), v1.2.0 & v1.0.0
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.2.3 dist-apk/*.apk --clobber || true
        gh release upload v1.2.1 dist-apk/*.apk --clobber || true
        gh release upload v1.2.0 dist-apk/*.apk --clobber || true
        gh release upload v1.0.0 dist-apk/*.apk --clobber || true
