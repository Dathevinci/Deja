name: Android CI & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: "!endsWith(github.ref_name, '-win') && !endsWith(github.ref_name, '-windows') && !endsWith(github.ref_name, '-desktop')"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Keystore & local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > deja-release.jks
          echo "storeFile=deja-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        else
          keytool -genkeypair -v -keystore deja-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias deja -storepass dejapass123 -keypass dejapass123 -dname "CN=Deja, OU=Music, O=Deja, L=Global, S=Global, C=US"
          echo "storeFile=deja-release.jks" > keystore.properties
          echo "storePassword=dejapass123" >> keystore.properties
          echo "keyAlias=deja" >> keystore.properties
          echo "keyPassword=dejapass123" >> keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare Named Deja APKs
      run: |
        mkdir -p dist-apk
        UNIV=$(find app/build/outputs/apk/prod/release -name "*universal*.apk" | head -n 1)
        ARM64=$(find app/build/outputs/apk/prod/release -name "*arm64-v8a*.apk" | head -n 1)
        ANY_APK=$(find app/build/outputs/apk/prod/release -name "*.apk" | head -n 1)
        if [ -n "$UNIV" ]; then
          cp "$UNIV" dist-apk/Deja.apk
        elif [ -n "$ANY_APK" ]; then
          cp "$ANY_APK" dist-apk/Deja.apk
        fi
        if [ -n "$ARM64" ]; then
          cp "$ARM64" dist-apk/Deja-arm64-v8a.apk
        fi
        ls -lh dist-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: deja-android-release-apk
        path: dist-apk/*.apk

    - name: Attach APK to Latest GitHub Release & Version Tags
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'EOF' > release-notes-v1.6.4.md
        1. Tap **Install Now** → **Install** to install **Deja 1.6.4**.
        2. Tap the **"Deja 1.6.4 Installed — Tap to Finish"** notification (or open the new **Deja** app icon) and press **OK** to remove this old copy!

        ---
        [android-only] windows_version: 1.6.3
        EOF

        if gh release view v1.6.4 >/dev/null 2>&1; then
          gh release edit v1.6.4 --title "Deja v1.6.4 [android-only]" --notes-file release-notes-v1.6.4.md --latest || true
        else
          gh release create v1.6.4 dist-apk/*.apk --title "Deja v1.6.4 [android-only]" --notes-file release-notes-v1.6.4.md --latest || true
        fi
        gh release upload v1.6.4 dist-apk/*.apk --clobber || true

        mkdir -p win-assets-163
        gh release download v1.6.3 -D win-assets-163 -p "*.exe" -p "*.blockmap" -p "latest.yml" --clobber || true
        if ls win-assets-163/* >/dev/null 2>&1; then
          gh release upload v1.6.4 win-assets-163/* --clobber || true
        fi

        LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
        if [ -n "$LATEST_TAG" ]; then
          gh release upload "$LATEST_TAG" dist-apk/*.apk --clobber || true
        fi
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" != "v1.6.4" ]; then
            gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "Deja $TAG_NAME" --notes "Deja $TAG_NAME for Windows & Android" || true
          fi
          gh release upload "$TAG_NAME" dist-apk/*.apk --clobber || true
        fi
        gh release upload v1.6.3 dist-apk/*.apk --clobber || true
        gh release upload v1.6.2 dist-apk/*.apk --clobber || true
        gh release upload v1.6.1 dist-apk/*.apk --clobber || true
        gh release upload v1.6.0 dist-apk/*.apk --clobber || true
