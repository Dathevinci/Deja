name: Build Deja CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Execute Deja test suite
        run: npm test

  build-windows:
    name: Build Windows Desktop Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package Windows Installer & Portable (.exe)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Standard Release Asset Filenames
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "Deja Setup *.exe" | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
          }
          Get-ChildItem dist -Filter "Deja Setup *.blockmap" | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
          }
          Get-ChildItem dist -Filter "Deja *.exe" | Where-Object { $_.Name -notmatch "Setup" } | ForEach-Object {
            $dotted = $_.Name.Replace(" ", ".")
            $dashed = $_.Name.Replace(" ", "-")
            if ($dotted -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dotted) -Force }
            if ($dashed -ne $_.Name) { Copy-Item $_.FullName (Join-Path "dist" $dashed) -Force }
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Deja-Windows-Build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
